name: Build extension and release

on: [push, pull_request, workflow_dispatch]

jobs:
  build_and_release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Install pnpm
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y curl
          curl -fsSL https://get.pnpm.io/install.sh | bash -
          export PNPM_HOME=$HOME/.local/share/pnpm
          echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"
          echo "PATH=$PNPM_HOME:$PATH" >> "$GITHUB_ENV"

      - name: Get version
        id: get_version
        shell: bash
        run: |
          BASE_VERSION="$(node -pe 'require("./package.json").version.split(".").slice(0, 2).join(".")')"
          PATCH="$(git rev-list --count $(node -pe 'require("./package.json").version')...HEAD --)"
          VERSION="${BASE_VERSION}.${PATCH}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        shell: bash
        run: |
          pnpm env use --global jod
          pnpm install --frozen-lockfile

      - name: Build extension
        shell: bash
        run: |
          pnpm version --no-git-tag-version --no-git-checks --allow-same-version ${{ steps.get_version.outputs.version }}
          pnpm run v:pack

      - name: Publish extension
        if: github.ref_name == 'main'
        shell: bash
        run: |
          pnpm run v:publish -p ${{ secrets.VSC_MARKETPLACE_TOKEN }}
